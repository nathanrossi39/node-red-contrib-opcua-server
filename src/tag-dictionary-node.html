<script type="text/javascript">
  /* Converts an old-style nested {folder: {tagName: dataType}} dictionary
     (the hand-typed "Master Dictionary" pattern this node replaces) into
     this node's flat row format. Any dataType not in the known list falls
     back to "Double" rather than silently dropping the tag. */
  function opcuaTagDictionaryConvertNested(nested) {
    const validTypes = ["Double", "Boolean", "Int16", "Int32", "String"];
    const rows = [];

    Object.keys(nested).forEach(function (folder) {
      const tags = nested[folder];
      if (!tags || typeof tags !== "object") {
        return;
      }
      Object.keys(tags).forEach(function (tagName) {
        let dataType = tags[tagName];
        if (validTypes.indexOf(dataType) === -1) {
          dataType = "Double";
        }
        rows.push({ folder: folder, tagName: tagName, dataType: dataType });
      });
    });

    return rows;
  }

  RED.nodes.registerType("opcua-tag-dictionary", {
    category: "OPC UA",
    color: "#c0deed",
    defaults: {
      name: { value: "" },
      blueprintContextKey: { value: "OpcBlueprint" },
      contextStore: { value: "memoryOnly" },
      tags: { value: [] },
    },
    inputs: 1,
    outputs: 1,
    icon: "icon.png",
    label: function () {
      return this.name || "opcua-tag-dictionary";
    },
    paletteLabel: "tag dictionary",
    oneditprepare: function () {
      const node = this;
      const dataTypes = ["Double", "Boolean", "Int16", "Int32", "String"];

      $("#node-input-tag-container")
        .css("min-height", "250px")
        .css("min-width", "550px")
        .editableList({
          addItem: function (container, index, data) {
            data.folder = data.folder || "";
            data.tagName = data.tagName || "";
            data.dataType = data.dataType || "Double";

            const row = $("<div/>", { style: "display:flex; gap:6px;" }).appendTo(
              container
            );

            $("<input/>", {
              type: "text",
              class: "node-input-tag-folder",
              placeholder: "Folder (e.g. Machine1)",
              style: "flex:2; min-width:0;",
            })
              .val(data.folder)
              .appendTo(row);

            $("<input/>", {
              type: "text",
              class: "node-input-tag-name",
              placeholder: "Tag name (e.g. Speed)",
              style: "flex:2; min-width:0;",
            })
              .val(data.tagName)
              .appendTo(row);

            const select = $("<select/>", {
              class: "node-input-tag-type",
              style: "flex:1; min-width:0;",
            }).appendTo(row);

            dataTypes.forEach(function (t) {
              $("<option/>").val(t).text(t).appendTo(select);
            });
            select.val(data.dataType);
          },
          removable: true,
          sortable: true,
        });

      const tags = Array.isArray(node.tags) ? node.tags : [];
      tags.forEach(function (tag) {
        $("#node-input-tag-container").editableList("addItem", tag);
      });

      /* Import from JSON - collapsed by default, since most edits are
         just tweaking a row or two, not a full re-import. */
      $("#node-tag-dictionary-import-toggle").on("click", function () {
        $("#node-tag-dictionary-import-panel").toggle();
      });

      $("#node-tag-dictionary-import-button").on("click", function () {
        const raw = $("#node-tag-dictionary-import-textarea").val().trim();
        if (!raw) {
          RED.notify("Paste a dictionary object first.", "warning");
          return;
        }

        let parsed;
        try {
          parsed = JSON.parse(raw);
        } catch (err) {
          RED.notify(
            "Could not parse as JSON: " + err.message,
            { type: "error", timeout: 6000 }
          );
          return;
        }

        if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) {
          RED.notify(
            "Expected an object like {\"FolderName\": {\"TagName\": \"Double\"}}.",
            { type: "error", timeout: 6000 }
          );
          return;
        }

        const rows = opcuaTagDictionaryConvertNested(parsed);
        if (rows.length === 0) {
          RED.notify("No tags found in that object.", "warning");
          return;
        }

        const replace = $("#node-tag-dictionary-import-replace").is(":checked");
        if (replace) {
          $("#node-input-tag-container").editableList("empty");
        }
        rows.forEach(function (row) {
          $("#node-input-tag-container").editableList("addItem", row);
        });

        RED.notify(
          "Imported " + rows.length + " tag(s) across " +
            Object.keys(parsed).length + " folder(s).",
          "success"
        );
        $("#node-tag-dictionary-import-textarea").val("");
      });
    },
    oneditsave: function () {
      const rows = $("#node-input-tag-container").editableList("items");
      const tags = [];

      rows.each(function () {
        const folder = $(this).find(".node-input-tag-folder").val();
        const tagName = $(this).find(".node-input-tag-name").val();
        const dataType = $(this).find(".node-input-tag-type").val();
        tags.push({ folder: folder, tagName: tagName, dataType: dataType });
      });

      this.tags = tags;
    },
  });
</script>

<script type="text/html" data-template-name="opcua-tag-dictionary">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Tag Dictionary">
  </div>

  <div class="form-row">
    <label for="node-input-blueprintContextKey"><i class="fa fa-key"></i> Context Key</label>
    <input type="text" id="node-input-blueprintContextKey" placeholder="OpcBlueprint">
  </div>

  <div class="form-row">
    <label for="node-input-contextStore"><i class="fa fa-database"></i> Context Store</label>
    <input type="text" id="node-input-contextStore" placeholder="memoryOnly">
  </div>

  <div class="form-tips" style="margin-bottom: 8px;">
    Add one row per tag below. Tags sharing the same Folder name are grouped
    together automatically - this becomes the OPC UA folder structure your
    address-space script (via opcua-blueprint-helper.js) reads from. Published
    to flow context under the Context Key above whenever this node deploys,
    or whenever it receives an input message (wire an inject node to it if
    you want to force a refresh without redeploying).
  </div>

  <div class="form-row">
    <a href="#" id="node-tag-dictionary-import-toggle" style="font-size: 13px;">
      <i class="fa fa-upload"></i> Import from JSON (e.g. an old hand-typed dictionary)
    </a>
  </div>
  <div id="node-tag-dictionary-import-panel" style="display:none; margin-bottom: 10px;">
    <div class="form-tips" style="margin-bottom: 6px;">
      Paste an object shaped like
      <code>{"FolderName": {"TagName": "Double", "OtherTag": "Boolean"}}</code>
      - this is the same shape as the old hand-typed "Master Dictionary"
      pattern. Unrecognized data types fall back to "Double" rather than
      being dropped.
    </div>
    <textarea id="node-tag-dictionary-import-textarea" rows="8" style="width:100%; font-family:monospace; font-size:12px;" placeholder='{
  "Machine1": {
    "Speed": "Double",
    "Running": "Boolean"
  }
}'></textarea>
    <div style="margin-top: 6px;">
      <label style="font-weight:normal;">
        <input type="checkbox" id="node-tag-dictionary-import-replace" checked style="width:auto; vertical-align:middle;">
        Replace existing rows (uncheck to add alongside what's already there)
      </label>
    </div>
    <button type="button" id="node-tag-dictionary-import-button" class="red-ui-button" style="margin-top: 6px;">
      <i class="fa fa-upload"></i> Import
    </button>
  </div>

  <div class="form-row node-input-rule-container-row">
    <ol id="node-input-tag-container"></ol>
  </div>
</script>

<script type="text/html" data-help-name="opcua-tag-dictionary">
  <p>
    A configuration screen for the OPC UA tag dictionary (the "blueprint"),
    replacing hand-typed JavaScript in a Function node with an editable
    table right in the Node-RED editor.
  </p>
  <p>
    Each row is one tag: a Folder name (tags sharing a folder are grouped
    together), a Tag name, and a Data Type. On deploy, this is converted
    into the nested <code>{folder: {tagName: dataType}}</code> shape and
    published to flow context under the configured Context Key - the same
    convention <code>examples/opcua-blueprint-helper.js</code> reads from,
    so no other part of your flow needs to change when you add or edit
    tags here.
  </p>
  <p>
    Migrating from an old hand-typed dictionary? Use "Import from JSON" to
    paste the whole object in at once instead of re-typing every tag.
  </p>
  <h3>Inputs</h3>
  <p>
    Any input message re-publishes the current dictionary (useful for
    forcing a refresh via an inject node without a full redeploy).
  </p>
  <h3>Outputs</h3>
  <p>
    <code>msg.payload</code> - the published blueprint object, on both
    deploy and any input message.
  </p>
</script>
